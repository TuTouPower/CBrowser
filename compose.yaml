# CBrowser stack definition (t027).
#
# All service images are pinned by the release env file generated by
# scripts/deploy.sh (immutable image IDs from the release manifest);
# there are deliberately no build blocks, so `up` never builds.  Instance
# identity (project, container names, resource prefix, edge network) is
# parameterized so a second isolated instance can coexist on one daemon.
name: ${CBROWSER_COMPOSE_PROJECT:-cbrowser}

x-no-proxy-env: &no-proxy-env
  HTTP_PROXY: ""
  HTTPS_PROXY: ""
  ALL_PROXY: ""
  http_proxy: ""
  https_proxy: ""
  all_proxy: ""
  NO_PROXY: "localhost,127.0.0.1,api,gateway,supervisor,caddy"
  no_proxy: "localhost,127.0.0.1,api,gateway,supervisor,caddy"

services:
  api:
    image: ${CBROWSER_API_IMAGE:?run scripts/deploy.sh first}
    container_name: ${CBROWSER_PREFIX:-cbrowser}-api
    read_only: true
    labels:
      com.cbrowser.instance-id: ${CBROWSER_INSTANCE_ID:?run scripts/deploy.sh first}
      com.cbrowser.media-subnet-pool: ${CBROWSER_MEDIA_SUBNET_POOL:?run scripts/deploy.sh first}
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      <<: *no-proxy-env
      CBROWSER_DB_PATH: /data/db/cbrowser.db
      CBROWSER_FONTS_DIR: /fonts
      CBROWSER_SUPERVISOR_URL: http://supervisor:8005
      CBROWSER_REQUIRE_SUPERVISOR: "1"
      CBROWSER_SUPERVISOR_TOKEN_FILE: /run/secrets/supervisor_key
      CBROWSER_GATEWAY_API_TOKEN_FILE: /run/secrets/gateway_api_key
      CBROWSER_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      # t064: edge authorization — the API verifies Caddy's forward_auth
      # proof and mints the viewer grants the Gateway verifies.
      CBROWSER_EDGE_PROOF_FILE: /run/secrets/edge_proof_key
      CBROWSER_VIEWER_GRANT_KEY_FILE: /run/secrets/viewer_grant_key
      # t054: the Origin whitelist is derived from the deploy port; the
      # trusted proxy CIDRs are the edge subnet, both injected by deploy.sh.
      CBROWSER_HTTPS_PORT: ${CBROWSER_HTTPS_PORT:?run scripts/deploy.sh first}
      CBROWSER_TRUSTED_PROXY_CIDRS: ${CBROWSER_TRUSTED_PROXY_CIDRS:?run scripts/deploy.sh first}
    volumes:
      - ${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}:/data
      - db:/data/db
      - ${CBROWSER_FONTS_DIR:?set CBROWSER_FONTS_DIR}:/fonts:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/supervisor_key:/run/secrets/supervisor_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/gateway_api_key:/run/secrets/gateway_api_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/admin_password:/run/secrets/admin_password:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/edge_proof_key:/run/secrets/edge_proof_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/viewer_grant_key:/run/secrets/viewer_grant_key:ro
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s

  gateway:
    image: ${CBROWSER_GATEWAY_IMAGE:?run scripts/deploy.sh first}
    container_name: ${CBROWSER_PREFIX:-cbrowser}-gateway
    read_only: true
    labels:
      com.cbrowser.managed-by: supervisor
      com.cbrowser.role: gateway
      com.cbrowser.prefix: ${CBROWSER_PREFIX:-cbrowser}
      com.cbrowser.instance-id: ${CBROWSER_INSTANCE_ID:?run scripts/deploy.sh first}
      com.cbrowser.media-subnet-pool: ${CBROWSER_MEDIA_SUBNET_POOL:?run scripts/deploy.sh first}
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      <<: *no-proxy-env
      CBROWSER_GATEWAY_HOST: 0.0.0.0
      CBROWSER_GATEWAY_PORT: "18080"
      CBROWSER_AGENT_KEY_FILE: /run/secrets/agent_key
      CBROWSER_GATEWAY_TOKEN_FILE: /run/secrets/gateway_key
      CBROWSER_GATEWAY_API_URL: http://api:8000
      CBROWSER_GATEWAY_API_TOKEN_FILE: /run/secrets/gateway_api_key
      # t064: the Gateway verifies API-minted viewer grants locally; it
      # never receives the session cookie.
      CBROWSER_VIEWER_GRANT_KEY_FILE: /run/secrets/viewer_grant_key
      # t054: same deploy port as the API (Origin whitelist derivation);
      # the trusted proxy CIDRs are the edge subnet. No network state
      # directory is mounted anymore: the Gateway reads no disk state.
      CBROWSER_HTTPS_PORT: ${CBROWSER_HTTPS_PORT:?run scripts/deploy.sh first}
      CBROWSER_TRUSTED_PROXY_CIDRS: ${CBROWSER_TRUSTED_PROXY_CIDRS:?run scripts/deploy.sh first}
    volumes:
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/agent_key:/run/secrets/agent_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/gateway_key:/run/secrets/gateway_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/gateway_api_key:/run/secrets/gateway_api_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/viewer_grant_key:/run/secrets/viewer_grant_key:ro
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/gateway/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  supervisor:
    image: ${CBROWSER_SUPERVISOR_IMAGE:?run scripts/deploy.sh first}
    container_name: ${CBROWSER_PREFIX:-cbrowser}-supervisor
    read_only: true
    cap_add: [FOWNER, DAC_OVERRIDE]
    labels:
      com.cbrowser.instance-id: ${CBROWSER_INSTANCE_ID:?run scripts/deploy.sh first}
      com.cbrowser.media-subnet-pool: ${CBROWSER_MEDIA_SUBNET_POOL:?run scripts/deploy.sh first}
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      <<: *no-proxy-env
      CBROWSER_BROWSER_IMAGE: ${CBROWSER_BROWSER_IMAGE:?build browser image first}
      CBROWSER_STREAM_IMAGE: ${CBROWSER_STREAM_IMAGE:?build stream image first}
      CBROWSER_PROXY_FORWARDER_IMAGE: ${CBROWSER_PROXY_FORWARDER_IMAGE:?build proxy-forwarder image first}
      CBROWSER_NETWORK_POLICY_IMAGE: ${CBROWSER_SUPERVISOR_IMAGE:?build supervisor image first}
      CBROWSER_API_URL: http://api:8000
      CBROWSER_GATEWAY_URL: ws://gateway:18080
      CBROWSER_GATEWAY_CONTROL_URL: http://gateway:18080
      CBROWSER_GATEWAY_CONTAINER_ID: ${CBROWSER_PREFIX:-cbrowser}-gateway
      CBROWSER_GATEWAY_PORT: "18080"
      CBROWSER_SUPERVISOR_TOKEN_FILE: /run/secrets/supervisor_key
      CBROWSER_AGENT_KEY_FILE: /run/secrets/agent_key
      CBROWSER_GATEWAY_TOKEN_FILE: /run/secrets/gateway_key
      CBROWSER_DATA_ROOT: ${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}
      CBROWSER_SOCKET_ROOT: ${CBROWSER_SOCKET_ROOT:-/run/cb/socks}
      CBROWSER_ENGINE_CACHE: ${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}/engine-cache
      CBROWSER_GEOIP_CACHE: ${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}/engine-cache/geoip
      CLOAKBROWSER_AUTO_UPDATE: "false"
      CBROWSER_ENGINE_BUILD: ${CBROWSER_ENGINE_BUILD:?run scripts/deploy.sh first}
      CBROWSER_ENGINE_BINARY_SHA256: ${CBROWSER_ENGINE_BINARY_SHA256:-}
      CBROWSER_FONTS_DIR: /fonts
      CBROWSER_PREFIX: ${CBROWSER_PREFIX:-cbrowser}
      CBROWSER_INSTANCE_ID: ${CBROWSER_INSTANCE_ID:?run scripts/deploy.sh first}
      CBROWSER_MEDIA_SUBNET_POOL: ${CBROWSER_MEDIA_SUBNET_POOL:?run scripts/deploy.sh first}
      CBROWSER_MANAGE_OWNERSHIP: "1"
    command: ["--host", "0.0.0.0", "--port", "8005"]
    volumes:
      - ${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}:${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}
      - ${CBROWSER_SOCKET_ROOT:-/run/cb/socks}:${CBROWSER_SOCKET_ROOT:-/run/cb/socks}:rw
      - ${CBROWSER_FONTS_DIR:?set CBROWSER_FONTS_DIR}:/fonts:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/supervisor_key:/run/secrets/supervisor_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/agent_key:/run/secrets/agent_key:ro
      - ${CBROWSER_SECRETS_DIR:?set CBROWSER_SECRETS_DIR}/gateway_key:/run/secrets/gateway_key:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Runs inside the supervisor container, reading the token from the
      # already-mounted secret file: the host never needs the secret, and
      # the control plane starts before the initial scan (t027), so this
      # liveness probe is not blocked by reconciliation.
      test: ["CMD", "python3", "-c", "import os, urllib.request; token = open(os.environ['CBROWSER_SUPERVISOR_TOKEN_FILE']).read().strip(); req = urllib.request.Request('http://127.0.0.1:8005/supervisor/v1/health', headers={'Authorization': 'Bearer ' + token}); urllib.request.urlopen(req, timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  caddy:
    image: ${CBROWSER_CADDY_IMAGE:?run scripts/deploy.sh first}
    container_name: ${CBROWSER_PREFIX:-cbrowser}-caddy
    labels:
      com.cbrowser.instance-id: ${CBROWSER_INSTANCE_ID:?run scripts/deploy.sh first}
      com.cbrowser.media-subnet-pool: ${CBROWSER_MEDIA_SUBNET_POOL:?run scripts/deploy.sh first}
    environment:
      <<: *no-proxy-env
      # Fingerprint carriers: when the Caddyfile or the frontend product
      # changes, only caddy's environment changes, so `up` recreates only
      # caddy; an unchanged configuration leaves caddy running (AC-005).
      CBROWSER_CADDYFILE_SHA256: ${CBROWSER_CADDYFILE_SHA256:-}
      CBROWSER_FRONTEND_SHA256: ${CBROWSER_FRONTEND_SHA256:-}
      # t064: Caddy presents this deployment secret to the API on
      # forward_auth subrequests (the rendered Caddyfile references it
      # only as an {env.*} placeholder). deploy.sh supplies it from the
      # edge_proof_key secret file; it is never rendered or recorded.
      CBROWSER_EDGE_PROOF_SECRET: ${CBROWSER_EDGE_PROOF_SECRET:?run scripts/deploy.sh first}
    ports:
      # t054: loopback only — there is no bind host to configure anymore.
      - "127.0.0.1:${CBROWSER_HTTPS_PORT:?run scripts/deploy.sh first}:443"
    volumes:
      - ${CBROWSER_DATA_ROOT:?set CBROWSER_DATA_ROOT}/network/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/frontend/dist:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

networks:
  edge:
    name: ${CBROWSER_PREFIX:-cbrowser}-edge
    # t054: fixed per-instance IPAM subnet derived by deploy.sh from the
    # instance identity; the same value is injected as
    # CBROWSER_TRUSTED_PROXY_CIDRS into API + Gateway.
    ipam:
      config:
        - subnet: ${CBROWSER_EDGE_SUBNET:?run scripts/deploy.sh first}

volumes:
  db:
    name: ${CBROWSER_PREFIX:-cbrowser}-db
  caddy_data:
  caddy_config:
