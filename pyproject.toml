[project]
name = "cbrowser"
version = "2.0.0"
description = "Self-hosted Docker browser manager with WebRTC display and isolated profile sandboxes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "cloakbrowser[geoip]>=0.6.3",
    "websockets>=14.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "docker>=7.0.0",
    "argon2-cffi>=23.1.0",
    "aiohttp>=3.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    ".repo_template/tests",
    "src/backend/tests",
    "tests",
]
markers = [
    "contract: lightweight repository contract tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
