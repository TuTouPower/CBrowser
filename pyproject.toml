[project]
name = "cbrowser"
version = "2.0.0"
description = "Self-hosted Docker browser manager with WebRTC display and isolated profile sandboxes"
readme = "README.md"
requires-python = ">=3.15"

[project.scripts]
cbrowser-agent = "cbrowser.agent_executor.cli:main"

[dependency-groups]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "aiohttp>=3.9.0",
    "docker>=7.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "argon2-cffi>=23.1.0",
]
gateway = ["aiohttp>=3.9.0", "pydantic>=2.0.0", "httpx>=0.27.0"]
supervisor = [
    "docker>=7.0.0", "httpx>=0.27.0", "pydantic>=2.0.0",
    "fastapi>=0.110.0", "uvicorn>=0.28.0", "websockets>=17.0",
]
browser = [
    "fastapi>=0.115.0", "uvicorn>=0.30.0", "websockets>=13.0",
    "httpx>=0.27.0", "pydantic>=2.8.0",
    "playwright==1.64.1", "cloakbrowser[geoip]==0.6.4",
    "pillow==13.0.0",
]
stream = ["selkies==2.2.1", "pydantic==2.14.1", "aiohttp==3.14.5"]
gate = [
    "pytest>=9.0", "pytest-asyncio>=1.0", "httpx>=0.27.0",
    "aiosqlite>=0.20.0", "sqlalchemy[asyncio]>=2.0.0", "alembic>=1.13.0",
    "fastapi>=0.115.0", "pydantic>=2.0", "uvicorn>=0.34.0",
    "jsonschema>=4.20", "websockets>=14.0", "cloakbrowser==0.6.4",
    "docker>=7.0.0", "aiohttp>=3.9.0", "argon2-cffi>=23.1.0",
    "playwright==1.64.1", "pytest-xdist>=3.6",
    "pillow==13.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests/fixtures", "src/backend"]
testpaths = [
    ".repo_template/tests",
    "tests",
]
markers = [
    "contract: lightweight repository contract tests",
    "e2e_images(*names): immutable image variables required by this module",
    "serial: timing-sensitive tests that must not run concurrently with others",
]
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:Setting per-request cookies=.* is being deprecated:DeprecationWarning",
    "ignore:Bare functions are deprecated, use async ones:DeprecationWarning",
    "ignore:jsonschema.RefResolver is deprecated:DeprecationWarning",
]
