services:
  manager:
    build: .
    ports:
      - "0.0.0.0:56661:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "karsondemacbook-pro.local:host-gateway"
    volumes:
      - ~/.cloakbrowser-manager:/data
    environment:
      # Values come from the manager-root .env (compose reads it automatically).
      - AUTH_TOKEN=${AUTH_TOKEN:-}
      - CLOAKBROWSER_LICENSE_KEY=${CLOAKBROWSER_LICENSE_KEY:-}
      - CLOAKBROWSER_RELEASE_CHANNEL=${CLOAKBROWSER_RELEASE_CHANNEL:-stable}
      # Per-profile file limits; unset means the built-in defaults apply.
      - ARTIFACT_MAX_BYTES=${ARTIFACT_MAX_BYTES:-}
      - ARTIFACT_MAX_COUNT=${ARTIFACT_MAX_COUNT:-}
      - ARTIFACT_MAX_TOTAL_BYTES=${ARTIFACT_MAX_TOTAL_BYTES:-}
