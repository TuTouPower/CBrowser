name: cbrowser

services:
  api:
    image: cbrowser-api:deploy
    build:
      context: .
      dockerfile: config/docker/api_runtime/Dockerfile
    container_name: cbrowser-api
    read_only: true
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      CBROWSER_DB_PATH: /data/cbrowser.db
      CBROWSER_SUPERVISOR_URL: http://supervisor:8005
      CBROWSER_REQUIRE_SUPERVISOR: "1"
      CBROWSER_SUPERVISOR_TOKEN_FILE: /run/secrets/supervisor_key
      CBROWSER_GATEWAY_API_TOKEN_FILE: /run/secrets/gateway_api_key
      CBROWSER_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      CBROWSER_ALLOWED_ORIGINS: ${CBROWSER_PUBLIC_ORIGIN:?set CBROWSER_PUBLIC_ORIGIN}
    volumes:
      - ./data/v2:/data
      - ./config/deploy/secrets:/run/secrets:ro
    networks: [edge]
    restart: unless-stopped

  gateway:
    image: cbrowser-gateway:deploy
    build:
      context: .
      dockerfile: config/docker/gateway_runtime/Dockerfile
    container_name: cbrowser-gateway
    read_only: true
    labels:
      com.cbrowser.managed-by: supervisor
      com.cbrowser.role: gateway
      com.cbrowser.prefix: cbrowser
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      CBROWSER_GATEWAY_HOST: 0.0.0.0
      CBROWSER_GATEWAY_PORT: "18080"
      CBROWSER_AGENT_KEY_FILE: /run/secrets/agent_key
      CBROWSER_GATEWAY_TOKEN_FILE: /run/secrets/gateway_key
      CBROWSER_GATEWAY_API_URL: http://api:8000
      CBROWSER_GATEWAY_API_TOKEN_FILE: /run/secrets/gateway_api_key
      CBROWSER_ALLOWED_ORIGINS: ${CBROWSER_PUBLIC_ORIGIN:?set CBROWSER_PUBLIC_ORIGIN}
    volumes:
      - ./config/deploy/secrets:/run/secrets:ro
    networks: [edge]
    depends_on: [api]
    restart: unless-stopped

  supervisor:
    image: cbrowser-supervisor:deploy
    build:
      context: .
      dockerfile: config/docker/supervisor_runtime/Dockerfile
    container_name: cbrowser-supervisor
    read_only: true
    cap_add: [FOWNER, DAC_OVERRIDE]
    tmpfs:
      - /tmp:rw,size=256m
    environment:
      CBROWSER_BROWSER_IMAGE: ${CBROWSER_BROWSER_IMAGE:?build browser image first}
      CBROWSER_STREAM_IMAGE: ${CBROWSER_STREAM_IMAGE:?build stream image first}
      CBROWSER_NETWORK_POLICY_IMAGE: ${CBROWSER_SUPERVISOR_IMAGE:?build supervisor image first}
      CBROWSER_API_URL: http://api:8000
      CBROWSER_GATEWAY_URL: ws://gateway:18080
      CBROWSER_GATEWAY_CONTROL_URL: http://gateway:18080
      CBROWSER_GATEWAY_CONTAINER_ID: cbrowser-gateway
      CBROWSER_GATEWAY_PORT: "18080"
      CBROWSER_SUPERVISOR_TOKEN_FILE: /run/secrets/supervisor_key
      CBROWSER_AGENT_KEY_FILE: /run/secrets/agent_key
      CBROWSER_GATEWAY_TOKEN_FILE: /run/secrets/gateway_key
      CBROWSER_DATA_ROOT: ${PWD}/data/v2
      CBROWSER_ENGINE_CACHE: ${PWD}/data/v2/engine-cache
      CBROWSER_GEOIP_CACHE: ${PWD}/data/v2/engine-cache/geoip
      CBROWSER_PREFIX: cbrowser
      CBROWSER_MANAGE_OWNERSHIP: "1"
    command: ["--host", "0.0.0.0", "--port", "8005"]
    volumes:
      - ./data/v2:${PWD}/data/v2
      - ./config/deploy/secrets:/run/secrets:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    depends_on: [api, gateway]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    container_name: cbrowser-caddy
    ports:
      - "127.0.0.1:${CBROWSER_HTTPS_PORT:-8443}:443"
    volumes:
      - ./config/deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./src/frontend/dist:/var/www/html:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [api, gateway]
    restart: unless-stopped

networks:
  edge:
    name: cbrowser-edge

volumes:
  caddy_data:
  caddy_config:
